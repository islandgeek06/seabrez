name: Release

# Push a version tag (e.g. v0.1.0) and GitHub builds the Windows installer and
# publishes it to a GitHub Release that anyone can download. Runs on GitHub's
# Windows runners, which build cleanly (no local Developer Mode needed).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Build renderer + main
        run: npm run build

      - name: Package & publish Windows installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload the installer to your Supabase Storage 'download' bucket so the
      # public download is served from your Supabase (Pro plan, size limit raised).
      - name: Upload installer to Supabase Storage
        if: ${{ env.SUPABASE_URL != '' }}
        shell: bash
        run: |
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/download/SeaBrez-Setup.exe" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"release/SeaBrez-Setup.exe")
          echo "HTTP $code"; cat resp.txt; echo
          test "$code" = "200"
