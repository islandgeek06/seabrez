name: Release

# Push a version tag (e.g. v0.1.0) and GitHub builds the Windows installer and
# publishes it to a GitHub Release that anyone can download. Runs on GitHub's
# Windows runners, which build cleanly (no local Developer Mode needed).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Build renderer + main
        run: npm run build

      - name: Package & publish Windows installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
